name: Unzip and Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        unzip BedrockProxy.zip -d extracted_project
        # Move files up if they are nested inside a subfolder
        find extracted_project -maxdepth 2 -name "gradlew" -exec dirname {} \; > project_dir.txt
        PROJ_DIR=$(cat project_dir.txt)
        if [ ! -z "$PROJ_DIR" ]; then
          mv $PROJ_DIR/* . || true
          mv $PROJ_DIR/.* . || true
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Change wrapper permissions
      run: |
        find . -name "gradlew" -exec chmod +x {} \;

    - name: Build Debug APK
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        cd $(dirname "$GRADLEW_PATH")
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/app-debug.apk"
        
