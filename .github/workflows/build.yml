name: Unzip and Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        unzip BedrockProxy.zip -d extracted_project
        # Find where your build.gradlew file is hiding
        PROJ_DIR=$(find extracted_project -name "build.gradlew" -exec dirname {} \; | head -n 1)
        if [ ! -z "$PROJ_DIR" ]; then
          mv $PROJ_DIR/* . || true
          mv $PROJ_DIR/.* . || true
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Prepare Wrapper Permissions
      run: |
        # Copying your file to standard 'gradlew' so the system runs it correctly
        cp build.gradlew gradlew || true
        chmod +x gradlew || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/app-debug.apk"
        
